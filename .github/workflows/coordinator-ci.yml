name: coordinator-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NetCDF command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes netcdf-bin

      - name: Install coordinator dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Check syntax and lint
        run: make check

      - name: Run portable coordinator tests
        run: make test
